# Melange Light - Direct styles
set -g @ukiyo-theme "kanagawa/dragon"
set -g @ukiyo-color-bg-bar "#F1F1F1"
set -g @ukiyo-color-bg-pane "#F4F4F4"
set -g @ukiyo-color-text "#54433A"
set -g @ukiyo-color-highlight "#A06469"
set -g @ukiyo-color-accent "#3A6A47"
set -g @ukiyo-color-info "#7892BD"
set -g @ukiyo-color-notice "#8B7449"
set -g @ukiyo-color-muted "#867462"

# Direct status bar styles (override)
set -g status-style "bg=#F1F1F1,fg=#54433A"
set -g pane-border-style "fg=#E0E0E0"
set -g pane-active-border-style "fg=#A06469"
set -g message-style "bg=#F1F1F1,fg=#54433A"
