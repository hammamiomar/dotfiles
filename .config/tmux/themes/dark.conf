# Kanagawa Dragon (dark) - Direct styles
set -g @ukiyo-theme "kanagawa/dragon"
set -g @ukiyo-color-bg-bar "#181616"
set -g @ukiyo-color-bg-pane "#181616"
set -g @ukiyo-color-text "#c5c9c5"
set -g @ukiyo-color-highlight "#957FB8"
set -g @ukiyo-color-accent "#76946A"
set -g @ukiyo-color-info "#7E9CD8"
set -g @ukiyo-color-notice "#E6C384"
set -g @ukiyo-color-muted "#938AA9"

# Direct status bar styles (override)
set -g status-style "bg=#181616,fg=#c5c9c5"
set -g pane-border-style "fg=#181616"
set -g pane-active-border-style "fg=#957FB8"
set -g message-style "bg=#181616,fg=#c5c9c5"
