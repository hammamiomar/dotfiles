# Set prefix to Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Core settings
set -g allow-passthrough on    # let yazi/etc draw real images through tmux
set -s escape-time 0           # no delay after Esc (important for vim)
set -g history-limit 2000000    # large scrollback for Claude Code sessions
set -g focus-events on         # for vim autoread
set -g scroll-on-clear off     # don't auto-scroll when output arrives
set -g status-position bottom
bind r source-file ~/.tmux.conf \; display "Reloaded"

# Prevent non-interactive launchers from forcing plain UI in new panes.
set-environment -gu NO_COLOR

# Set terminal colors
set-option -sa terminal-overrides ",xterm*:Tc"

# Extended keys (Shift+Enter etc. in Claude Code; needs a terminal that supports them)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Enable mouse support
set -g mouse on

# Mouse scroll tuning (via tmux-better-mouse-mode)
set -g @scroll-speed-num-lines-per-scroll "1"
set -g @scroll-without-changing-pane "on"
set -g @emulate-scroll-for-no-mouse-alternate-buffer "on"

# iOS / Termius: prefix-free PageUp/Down for two-finger swipe scrolling
bind -n PageUp copy-mode -eu
bind -n PageDown send-keys PageDown

# Wipe stale scrollback (old-width frames left behind after a resize)
bind C-x clear-history \; display "Scrollback cleared"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Size windows per viewing session, so a grouped phone session doesn't shrink desktop windows
set-window-option -g aggressive-resize on

# Open Finder in current pane's directory (prefix + Shift+o)
bind-key O run-shell 'open "#{pane_current_path}"'

# Move to next tmux window/tab (prefix + o)
bind-key o next-window

# kill pane
bind-key x kill-pane

# Pane resizing (prefix + H/J/K/L, repeatable)
bind -r H resize-pane -L 2
bind -r L resize-pane -R 2
bind -r K resize-pane -U 2
bind -r J resize-pane -D 2

# Layout shortcuts that avoid macOS/AeroSpace Option key bindings
bind V swap-pane -d -t :.1 \; select-layout main-vertical

# Move window to the left (Ctrl-a + <)
bind < swap-window -t -1\; select-window -t -1

# Move window to the right (Ctrl-a + >)
bind > swap-window -t +1\; select-window -t +1

# Set vi mode
set-window-option -g mode-keys vi

# Use visual selection mode as vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Save and restore session
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# Tmux theme - Ukiyo (Kanagawa variant)
set -g @ukiyo-plugins "cpu-usage"
set -g @ukiyo-left-icon session
set -g @ukiyo-left-icon-prefix-on-bg "notice"
set -g @ukiyo-cpu-usage-label "CPU"
set -g @ukiyo-cpu-usage-colors "accent bg_pane"

# Auto-detect macOS appearance and source matching theme
if-shell "defaults read -g AppleInterfaceStyle 2>/dev/null | grep -q Dark" \
  "source-file ~/.config/tmux/themes/dark.conf" \
  "source-file ~/.config/tmux/themes/light.conf"

TMUX_FZF_ORDER="session|window|pane|command|keybinding"
TMUX_FZF_OPTIONS="-p -w 90% -h 70% -m"

# more options here: https://github.com/sainnhe/tmux-fzf/issues/6#issuecomment-578750879
bind w run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/window.sh switch"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'NHDaly/tmux-better-mouse-mode'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-command 'echo -n {} | pbcopy && tmux display-message "Copied {}"'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'Nybkox/tmux-ukiyo'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-strategy-nvim 'session'

run '~/.tmux/plugins/tpm/tpm'

set -g extended-keys-format csi-u

# Bell = attention: Claude Code's Stop hook rings the terminal bell when it
# finishes, and any background window with a fresh bell turns green in the
# status bar (visiting the window clears it). Must stay AFTER the tpm run
# line so the ukiyo theme can't overwrite the format.
set -g window-status-bell-style 'fg=#181616,bg=#98BB6C,bold'
setw -g window-status-format '#{?window_bell_flag,#[fg=#181616]#[bg=#98BB6C] #I #W ,#[fg=#c5c9c5]#[bg=#181616] #I #W}'
